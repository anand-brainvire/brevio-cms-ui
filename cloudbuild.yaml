steps:
  - name: "gcr.io/cloud-builders/npm"
    entrypoint: bash
    args:
      - -c
      - |
        npm install
        echo "REACT_APP_API_GATEWAY_URL=${_REACT_APP_API_GATEWAY_URL}" >> .env
        echo "REACT_APP_API_MOBILE_URL=${_REACT_APP_API_MOBILE_URL}" >> .env
        echo "REACT_APP_ENCRYPTION_DECRYPTION_KEY=${_REACT_APP_ENCRYPTION_DECRYPTION_KEY}" >> .env
        echo "REACT_APP_API_BASENODE=${_REACT_APP_API_BASENODE}" >> .env 
        echo "REACT_APP_GOOGLE_MAPS_API_KEY=${_REACT_APP_GOOGLE_MAPS_API_KEY}" >> .env
        echo "REACT_APP_STRIPE_PUBLIC_KEY=${_REACT_APP_STRIPE_PUBLIC_KEY}" >> .env
        npm run build

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gsutil -m rsync -r -d build gs://${_GCS_BUCKET}

substitutions:
  _GCS_BUCKET: brevio-media-dev-public
  _REACT_APP_API_GATEWAY_URL: https://bsstaging.brainvire.dev/cms/graphql  # You can override this per trigger
  _REACT_APP_API_MOBILE_URL: https://bsstaging.brainvire.dev/backend/graphql
  _REACT_APP_ENCRYPTION_DECRYPTION_KEY: XXXXXXX
  _REACT_APP_API_BASENODE: XXXXXXX
  _REACT_APP_GOOGLE_MAPS_API_KEY: XXXXXXX
  _REACT_APP_STRIPE_PUBLIC_KEY: XXXXXXX

timeout: 6000s
options:
  logging: CLOUD_LOGGING_ONLY